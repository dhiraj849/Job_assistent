<!doctype html>
<html><head><title>Job Application for Backend Engineer at Acme</title>
<script src="https://www.google.com/recaptcha/api.js"></script></head>
<body>
<div id="main"><h1>Backend Engineer</h1><p>Payments team. PAN India hiring.</p>
<form id="application_form" action="/acme/jobs/123" method="post" enctype="multipart/form-data">
  <input type="hidden" name="authenticity_token" value="x">
  <div class="field"><label for="first_name">First Name <span class="asterisk">*</span></label>
    <input type="text" id="first_name" name="job_application[first_name]" autocomplete="given-name" aria-required="true"></div>
  <div class="field"><label for="last_name">Last Name <span class="asterisk">*</span></label>
    <input type="text" id="last_name" name="job_application[last_name]" autocomplete="family-name" aria-required="true"></div>
  <div class="field"><label for="email">Email <span class="asterisk">*</span></label>
    <input type="email" id="email" name="job_application[email]" autocomplete="email" required></div>
  <div class="field"><label for="phone">Phone</label>
    <input type="tel" id="phone" name="job_application[phone]" autocomplete="tel"></div>
  <div class="field"><label for="resume">Resume/CV <span class="asterisk">*</span></label>
    <input type="file" id="resume" name="job_application[resume]" accept=".pdf,.doc,.docx" required></div>
  <div class="field"><label for="q_linkedin">LinkedIn Profile</label>
    <input type="text" id="q_linkedin" name="job_application[answers_attributes][0][text_value]"></div>
  <div class="field"><label for="q_notice">What is your notice period? *</label>
    <select id="q_notice" name="job_application[answers_attributes][1][answer_selected_options_attributes][0][question_option_id]">
      <option value="">Please select</option><option value="1">Immediate</option>
      <option value="2">30 days</option><option value="3">60 days or more</option></select></div>
  <div class="g-recaptcha" data-size="invisible" data-sitekey="k"></div>
  <input type="submit" value="Submit Application">
</form></div>
</body></html>
