<!doctype html>
<html><head><title>Acme - Python Developer</title></head>
<body>
<div class="application-page">
<form method="POST" enctype="multipart/form-data" id="application-form">
  <ul>
    <li class="application-question"><label><div class="application-label">Resume/CV<span class="required">✱</span></div>
      <input type="file" name="resume" id="resume-upload-input" required></label></li>
    <li class="application-question"><label><div class="application-label">Full name<span class="required">*</span></div>
      <input type="text" name="name" required></label></li>
    <li class="application-question"><label><div class="application-label">Email<span class="required">*</span></div>
      <input type="email" name="email" required></label></li>
    <li class="application-question"><label><div class="application-label">Phone</div>
      <input type="text" name="phone"></label></li>
    <li class="application-question"><label><div class="application-label">Current company</div>
      <input type="text" name="org"></label></li>
    <li class="application-question"><label><div class="application-label">LinkedIn URL</div>
      <input type="text" name="urls[LinkedIn]"></label></li>
  </ul>
  <fieldset><legend>Are you willing to relocate to Bangalore? *</legend>
    <label><input type="radio" name="cards[abc][field0]" value="Yes"> Yes</label>
    <label><input type="radio" name="cards[abc][field0]" value="No"> No</label>
  </fieldset>
  <div class="h-captcha" data-size="invisible" data-sitekey="k"></div>
  <button type="submit" class="template-btn-submit">Submit application</button>
</form></div>
</body></html>
