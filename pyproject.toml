[project]
name = "mcp-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastembed>=0.8.1",
    "playwright==1.59.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "sqlalchemy[asyncio]>=2.0.54",
    "structlog>=26.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.7",
    "pytest>=9.1.1",
]
